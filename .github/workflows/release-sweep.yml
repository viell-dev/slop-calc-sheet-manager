name: Release sweep

# Manual release-preparation evidence; batch cross-platform runs to at most once per week.
# Includes the demonstrated Intel macOS headless lane (#145).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (LibreOffice ${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            label: "26.2.1"
          - lane: current-26.2
            label: "26.2 latest"
          - lane: current-26.8
            label: "26.8 latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Headless integration
        env:
          LANE: ${{ matrix.lane }}
        run: python3 tools/linux_integration.py "$LANE" --sessions headless
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-${{ matrix.lane }}
          path: test-results/
          if-no-files-found: error

  linux-gtk3:
    name: Linux gtk3 (LibreOffice ${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            label: "26.2.1"
          - lane: current-26.2
            label: "26.2 latest"
          - lane: current-26.8
            label: "26.8 latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Painted integration with crash backtrace
        env:
          LANE: ${{ matrix.lane }}
        run: python3 tools/linux_integration.py "$LANE" --sessions gtk3 --backtrace
      - name: Real-input UI tests with gtk3 and gen
        if: ${{ !cancelled() }}
        env:
          LANE: ${{ matrix.lane }}
        run: python3 tools/linux_integration.py "$LANE" --skip-build --ui --backtrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-gtk3-${{ matrix.lane }}
          path: test-results/
          if-no-files-found: error

  refusal:
    name: Refuses LibreOffice 26.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/linux_integration.py unsupported
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: refusal-26.2.0
          path: test-results/
          if-no-files-found: error

  windows:
    name: Windows (LibreOffice 26.8 latest)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python -m venv .venv
      - run: ./.venv/Scripts/python.exe -m pip install --require-hashes -r requirements-dev.txt
      - run: ./.venv/Scripts/python.exe tools/check.py
      - run: ./ci/install-windows.ps1
      - name: Install, activate, resize, and close the panel
        run: |
          $package = (Get-ChildItem -LiteralPath dist -Filter '*.oxt').FullName
          & 'C:\Program Files\LibreOffice\program\python.exe' tests/integration/run.py `
            --program 'C:\Program Files\LibreOffice\program' --oxt $package
          if ($LASTEXITCODE -ne 0) { throw 'Integration failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-integration
          path: |
            test-results/
            dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-installer-failure
          path: ${{ runner.temp }}/sheet-manager-msi.log
          if-no-files-found: warn

  desktop:
    name: Windows desktop real input
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned LibreOffice MSI
        run: ./ci/install-windows.ps1
      - name: Build the extension with LibreOffice's Python
        run: |
          & 'C:\Program Files\LibreOffice\program\python.exe' tools/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Real-input checks in a visible Calc window
        env:
          SHEET_MANAGER_REAL_DESKTOP: "1"
          CHECKS: ""
        run: |
          $package = (Get-ChildItem -LiteralPath dist -Filter '*.oxt').FullName
          $selected = @()
          foreach ($name in "$env:CHECKS".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            $selected += @('--check', $name)
          }
          & 'C:\Program Files\LibreOffice\program\python.exe' tests/ui/run_windows_ui.py `
            --program 'C:\Program Files\LibreOffice\program' --oxt $package `
            --output test-results/windows-desktop @selected
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop checks failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-desktop
          path: |
            test-results/windows-desktop/
            dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-desktop-installer-failure
          path: ${{ runner.temp }}/sheet-manager-msi.log
          if-no-files-found: warn

  macos:
    name: macOS Intel packaged integration
    runs-on: macos-15-intel
    # Allow room for native controls, command budgets, cleanup and artifact upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check native tool options before installation
        run: |
          hdiutil help || true
          ditto -h || true
          curl --help
      - name: Install privately and run with the bundled PyUNO interpreter
        run: python3 tools/macos_integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-integration
          path: |
            test-results/macos/
            dist/
          if-no-files-found: error

  gate:
    name: Full release sweep
    if: always()
    needs: [linux, linux-gtk3, refusal, windows, desktop, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse failed, missing or skipped required work
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_policy.py sweep
