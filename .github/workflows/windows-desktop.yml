name: Windows desktop

# RESEARCH BRANCH ONLY, never merged (#179, #45). The manual dispatch entry point runs native
# Windows probes instead of the desktop suite: the #179 public 0.0.9 -> 0.0.10 upgrade with Help
# queried before the first Calc document (and controls) under a non-invasive CDB trace, then the
# unchanged Windows integration suite. Raw dumps are analysed here and never uploaded.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "#179 probe plan: comma-separated order[:cdb] cases"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Windows native probes (research, #179 and #45)
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CDB: C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe
      LOPY: C:\Program Files\LibreOffice\program\python.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: package
        uses: ./.github/actions/libreoffice-package
        with:
          lane: windows
      - name: Install the pinned LibreOffice MSI
        run: ./ci/install-windows.ps1 -InstallerPath $env:LO_INSTALLER
        env:
          LO_INSTALLER: ${{ steps.package.outputs.path }}
      - name: Build the extension and stage the public packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & $env:LOPY tools/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path -LiteralPath $env:CDB)) { throw "CDB is missing: $env:CDB" }
          New-Item -ItemType Directory -Force research-assets | Out-Null
          gh release download 0.0.9 --pattern 'sheet-manager-0.0.9.oxt' --dir research-assets
          gh release download 0.0.10 --pattern 'sheet-manager-0.0.10.oxt' --dir research-assets
          Copy-Item -LiteralPath docs/fixtures/sheet-manager-manual-tests.fods research-assets/manual.fods
          $expected = @{
            'sheet-manager-0.0.9.oxt' = '174543F95E161152648FFC1E25D026B67650F67872F70BC28D89431904394D03'
            'sheet-manager-0.0.10.oxt' = '7ECA553E083CA083AA95AD1BDABB28EF8D48D6B7E5E2891B7D9315446DD9B354'
            'manual.fods' = '2D7679D57025AAF7146D70DE74BDE36413181C0862E4021B7A640BE88D24370B'
          }
          foreach ($name in $expected.Keys) {
            $hash = (Get-FileHash -LiteralPath "research-assets/$name" -Algorithm SHA256).Hash
            if ($hash -ne $expected[$name]) { throw "$name has $hash" }
          }
      - name: Resolve this build's Calc symbols for the trace
        run: |
          $symbols = "srv*$env:RUNNER_TEMP\sym*https://dev-downloads.libreoffice.org/symstore/symbols;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          & $env:LOPY research/resolve_rvas.py test-results/research/rvas $symbols
          if ($LASTEXITCODE -ne 0) { throw 'Symbol resolution failed' }
      - name: "#179 upgrade and Help-before-first-Calc probe"
        env:
          PROBE_RVAS: test-results/research/rvas/rvas.json
          PROBE_CDB_WORK: ${{ runner.temp }}\cdbwork
          PLAN: ${{ inputs.checks }}
        run: |
          $plan = if ($env:PLAN) { $env:PLAN } else {
            'help-first:cdb,calc-first:cdb,help-first:cdb,help-first,help-first:cdb,calc-first:cdb,help-first:cdb,help-first,help-first:cdb,help-first,help-first:cdb,help-first'
          }
          New-Item -ItemType Directory -Force $env:PROBE_CDB_WORK | Out-Null
          & $env:LOPY research/probe179.py --assets research-assets `
            --output test-results/research/probe179 --plan $plan
          if ($LASTEXITCODE -ne 0) { throw 'The probe itself failed' }
      - name: "#45 Windows integration suite (unchanged)"
        if: always()
        continue-on-error: true
        run: |
          $package = (Get-ChildItem -LiteralPath dist -Filter '*.oxt').FullName
          & $env:LOPY tests/integration/run.py --program 'C:\Program Files\LibreOffice\program' `
            --oxt $package --output test-results/research/integration
          if ($LASTEXITCODE -ne 0) { throw 'Integration failed' }
      - name: Analyse and remove raw dumps
        if: always() && steps.package.outcome == 'success'
        run: |
          $symbols = "srv*$env:RUNNER_TEMP\sym*https://dev-downloads.libreoffice.org/symstore/symbols;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          & $env:LOPY research/analyse_dumps.py test-results/research $symbols $env:CDB
          $left = Get-ChildItem -LiteralPath test-results/research -Recurse -Filter '*.dmp'
          if ($left) { throw "Raw dumps remain: $($left.FullName -join ', ')" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-native-research
          path: |
            test-results/research/
            !test-results/research/**/*.dmp
            !test-results/research/**/*.fods
          if-no-files-found: warn
