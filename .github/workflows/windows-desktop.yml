name: Windows desktop

# Real keyboard and mouse input to a visible LibreOffice on a GitHub-hosted Windows runner (#114).
# The runner's job runs in the active console session, where SendInput reaches the office.
# Focused manual investigation. Release sweep carries the required full desktop evidence.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Check names to run, separated by spaces; empty runs them all
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Windows desktop real input
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: package
        uses: ./.github/actions/libreoffice-package
        with:
          lane: windows
      - name: Install the pinned LibreOffice MSI
        run: ./ci/install-windows.ps1 -InstallerPath $env:LO_INSTALLER
        env:
          LO_INSTALLER: ${{ steps.package.outputs.path }}
      - name: Build the extension with LibreOffice's Python
        run: |
          git apply ci/worker_m_product.patch
          if (0 -ne 0) { throw 'Probe preparation failed' }
          & 'C:\Program Files\LibreOffice\program\python.exe' tools/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Focused contrast and screen-reader research
        env:
          SHEET_MANAGER_REAL_DESKTOP: "1"
        run: ./ci/worker-k-windows.ps1
      - name: Run installed-package Rename keyboard and mouse regressions
        if: always() && steps.package.outcome == 'success'
        env:
          SHEET_MANAGER_REAL_DESKTOP: "1"
        run: |
          $program = 'C:\Program Files\LibreOffice\program'
          $package = (Get-ChildItem dist/*.oxt).FullName
          & "$program/python.exe" tests/ui/run_windows_ui.py --program $program --oxt $package --output test-results/windows-desktop/rename-regression --check rename_sheets_keyboard --check rename_sheets_mouse
          if ($LASTEXITCODE -ne 0) { throw 'Rename regression failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-desktop
          path: |
            test-results/libreoffice-package.log
            test-results/windows-desktop/
            dist/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: windows-desktop-installer-failure
          path: ${{ runner.temp }}/sheet-manager-msi.log
          if-no-files-found: warn
