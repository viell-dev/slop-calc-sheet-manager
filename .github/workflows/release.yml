name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/pages.yml"
      - "tools/github_release.py"
      - "tools/release_data.py"
  workflow_dispatch:
    inputs:
      version:
        description: Exact plain dotted version in description.xml and CHANGELOG.md
        required: true
        type: string
      stage:
        description: >-
          Release stage, never inferred from the version. alpha, beta and rc are test builds with
          GitHub's Pre-release flag; stable must be chosen explicitly
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
      target:
        description: >-
          Agreed next-minor or next-major .0 release; required for beta and rc, optional for
          alpha, empty for stable
        default: ""
        type: string
      dry_run:
        description: Validate and upload a preview without creating a tag or release
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUESTED_VERSION: ${{ inputs.version }}
      STAGE: ${{ inputs.stage }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Refuse a publication request outside main
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref != 'refs/heads/main'
        run: |
          echo "Publication requires a manual dispatch on main; use dry_run on branches." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - run: .venv/bin/python tools/check.py
      - name: Validate exact commit, release history, notes, assets, and prospective feeds
        shell: bash
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=$(python -c 'import sys; sys.path.insert(0, "tools"); from build import version; print(version())')
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # A PR has no inputs: preview both channels, each with an explicit stage.
            .venv/bin/python tools/github_release.py release --version "$version" --stage stable
            .venv/bin/python tools/github_release.py release --version "$version" --stage alpha \
              --output dist/release/prerelease-preview
          else
            args=(release --version "$version" --stage "$STAGE")
            if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
            .venv/bin/python tools/github_release.py "${args[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ env.RELEASE_COMMIT }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.dry_run &&
      github.ref == 'refs/heads/main' && github.repository == 'viell-dev/slop-calc-sheet-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.sha }}
      REQUESTED_VERSION: ${{ inputs.version }}
      STAGE: ${{ inputs.stage }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Revalidate, tag exact commit, attach both assets to draft, then publish
        shell: bash
        run: |
          args=(release --version "$REQUESTED_VERSION" --stage "$STAGE" --publish)
          if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
          python tools/github_release.py "${args[@]}"

  feeds:
    needs: publish
    # Hold the same lock as standalone Pages runs across generation and deployment.
    concurrency:
      group: update-feeds
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
