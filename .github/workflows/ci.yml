name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - run: .venv/bin/python tools/check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Generate empty feeds offline; Pages checks the live release history when it deploys
        run: python tools/github_release.py pages --offline --output _site
      - name: Build the user guide; broken links between pages fail the build
        env:
          SHEET_MANAGER_RELEASES: _site/releases.json
        run: npm run docs:build
      - name: Combine the guide with the feeds as Pages does
        run: python tools/github_release.py combine --guide docs/.vitepress/dist --output _site
      - name: Check rendered release downloads with empty and synthetic history
        run: python tools/check_release_page.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-site
          path: _site/
          if-no-files-found: error

  linux:
    name: Linux current
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Current Linux headless integration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/ci
          python3 tools/linux_integration.py current-26.8 --sessions headless 2>&1 | tee test-results/ci/headless.log
      - name: Retain headless evidence before starting real input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-current-headless
          path: test-results/
          if-no-files-found: error
      - name: Current Linux real input with gtk3 and gen
        if: ${{ success() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/ci
          python3 tools/linux_integration.py current-26.8 --skip-build --ui --backtrace 2>&1 | tee test-results/ci/input.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-current
          path: test-results/
          if-no-files-found: error

  gate:
    name: Routine CI
    if: always()
    needs: [checks, docs, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Refuse failed, missing or skipped required work
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_policy.py routine
