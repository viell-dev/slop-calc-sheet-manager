name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose ${{ matrix.target.lane }} ${{ matrix.target.sessions }} ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
        target:
          - lane: minimum
            sessions: headless
          - lane: current-26.2
            sessions: gtk3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Integration under LibreOffice's gdb wrapper
        env:
          LANE: ${{ matrix.target.lane }}
          SESSIONS: ${{ matrix.target.sessions }}
        run: python3 tools/linux_integration.py "$LANE" --sessions "$SESSIONS" --backtrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnose-${{ matrix.target.lane }}-${{ matrix.target.sessions }}-${{ matrix.replica }}
          path: test-results/
          if-no-files-found: warn
