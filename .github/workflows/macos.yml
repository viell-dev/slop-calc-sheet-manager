name: macOS integration

# Focused on-demand investigation; release-sweep.yml requires the same packaged lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS Intel packaged integration
    runs-on: macos-15-intel
    # Internal command budgets total 43 minutes; allow cleanup and artifact upload too.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check native tool options before installation
        run: |
          hdiutil help || true
          ditto -h || true
          curl --help
      - name: Install privately and run with the bundled PyUNO interpreter
        run: python3 tools/macos_integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-integration
          path: |
            test-results/macos/
            dist/
          if-no-files-found: error
