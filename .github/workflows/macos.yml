name: macOS integration

# Default packaged integration matches the sweep; the optional probe is investigation only.
on:
  workflow_dispatch:
    inputs:
      theme_pick_probe:
        description: "Investigate eight paired initial-pick cases (not release evidence)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: >-
      ${{ inputs.theme_pick_probe && 'macOS initial pick investigation' || 'macOS Intel packaged integration' }}
    runs-on: macos-15-intel
    # Allow room for native controls, command budgets, cleanup and artifact upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check native tool options before installation
        run: |
          hdiutil help || true
          ditto -h || true
          curl --help
      - name: Install privately and run with the bundled PyUNO interpreter
        env:
          THEME_PICK_PROBE: ${{ inputs.theme_pick_probe }}
        run: |
          if [ "$THEME_PICK_PROBE" = "true" ]; then
            python3 tools/macos_integration.py --theme-pick-probe
          else
            python3 tools/macos_integration.py
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.theme_pick_probe && 'macos-theme-pick-probe' || 'macos-integration' }}
          path: |
            test-results/macos/
            dist/
          if-no-files-found: error
