name: Painted gtk3 soak

# Investigation branch for #8 only: this replaces the soak with ci/lab arms. Not for merging.

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Rounds per arm (1–100)"
        type: number
        default: 20
  workflow_call:
    inputs:
      sessions:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  soak:
    name: Crash lab (${{ matrix.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            tag: minimum
            arms: ci/lab/arms.txt
            flags: ""
          - lane: current-26.2
            tag: current-26.2
            arms: ci/lab/arms.txt
            flags: ""
          - lane: current-26.8
            tag: current-26.8
            arms: ci/lab/arms.txt
            flags: ""
          - lane: current-26.8
            tag: current-26.8-instrumented
            arms: ci/lab/arms-instr.txt
            flags: "--instrumented"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run lab arms round-robin in fresh painted profiles
        env:
          LANE: ${{ matrix.lane }}
          ROUNDS: ${{ inputs.sessions }}
          ARMS: ${{ matrix.arms }}
          FLAGS: ${{ matrix.flags }}
        run: python3 ci/lab/run_lab.py "$LANE" --rounds "$ROUNDS" --arms-file "$ARMS" ${FLAGS}
      - name: Publish the lab summary
        if: always()
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [ -f "test-results/$LANE/lab-summary.md" ]; then
            cat "test-results/$LANE/lab-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The lab did not produce a summary; inspect the job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crash-lab-${{ matrix.tag }}
          path: test-results/
          if-no-files-found: warn
