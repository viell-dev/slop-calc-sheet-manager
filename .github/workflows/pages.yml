name: Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 3 * * *"

permissions: {}

# The update feeds and the user guide share one Pages deployment, built together here.
# Generation and deployment share a lock: a queued run reads fresh release data.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'viell-dev/slop-calc-sheet-manager' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate feeds from published OXTs, refusing history changes or regressions
        run: python tools/github_release.py pages --output _site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Build the user guide for the releases just read
        env:
          SHEET_MANAGER_RELEASES: _site/releases.json
        run: npm run docs:build
      - name: Combine the guide with the feeds, refusing to replace any feed file
        run: python tools/github_release.py combine --guide docs/.vitepress/dist --output _site
      - name: Record the deployed content
        run: |
          {
            echo "Site built from $(git rev-parse HEAD) on main."
            echo "Published builds in the feeds: $(python -c 'import json; print(len(json.load(open("_site/releases.json"))))')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
