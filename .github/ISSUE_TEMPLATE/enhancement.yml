name: Improvement
description: Suggest a better way for something Sheet Manager already does to work
labels: ["Type: Enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Use this for changes to existing behaviour, including usability, keyboard operation, and
        speed. For a new capability, use the feature request form. Check the
        [status](https://github.com/viell-dev/slop-calc-sheet-manager#status) first: some features
        are planned but not built yet. If an AI agent wrote or submitted this, say so at the start:
        which agent, for whom, and whether a person reviewed it.
  - type: checkboxes
    id: checks
    attributes:
      label: Before suggesting
      options:
        - label: I searched the open and closed issues and found no suggestion like this.
          required: true
        - label: >-
            I follow the project's [code of
            conduct](https://github.com/viell-dev/slop-calc-sheet-manager/blob/main/CODE_OF_CONDUCT.md).
          required: true
  - type: textarea
    id: current
    attributes:
      label: What happens now
      description: >-
        What you do and what Sheet Manager does, with the Sheet Manager and LibreOffice versions.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would be better
      description: What you would like to happen instead, and why it matters for your work.
    validations:
      required: true
