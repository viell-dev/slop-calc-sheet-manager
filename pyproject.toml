[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tools", "tests", "extension/registration.py"]
extraPaths = ["src", "tools", "tests/integration"]
executionEnvironments = [
  { root = "src/sheet_manager/uno_calc.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_keys.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_list.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_menu.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_show.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_structure.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "src/sheet_manager/uno_reorder.py", reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportMissingTypeStubs = false },
  { root = "src/sheet_manager/uno_panel.py", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "tests/integration", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false },
  { root = "tests/ui", reportUnknownParameterType = false, reportMissingParameterType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportUnknownLambdaType = false, reportMissingTypeStubs = false, reportIncompatibleMethodOverride = false },
  { root = "." },
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "-ra"
